<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="site-header">
  <div class="wrap">

    <a href="index.html" class="brand">
      <img src="logo.png" alt="Office of Felix Feger" class="brand-logo">
    </a>

    <nav class="nav-desktop" aria-label="Primary">
      <a href="index.html">Welcome</a>
      <a href="travel.html">Travel</a>
      <a href="media.html" aria-current="page">Media</a>
      <a href="city-metro.html">City Metro</a>
      <a href="https://flights.felixfeger.com">Flights</a>
      <a href="https://blog.felixfeger.com">Blog</a>
      <a href="contact.html">Contact</a>
    </nav>

    <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">
      <span></span>
    </button>

  </div>

  <nav class="nav-mobile" aria-label="Mobile">
    <a href="index.html">Welcome</a>
    <a href="travel.html">Travel</a>
    <a href="media.html">Media</a>
    <a href="city-metro.html">City Metro</a>
    <a href="https://flights.felixfeger.com">Flights</a>
    <a href="https://blog.felixfeger.com">Blog</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>


<main>

  <!-- PAGE INTRODUCTION -->
  <section class="page-hero">
    <div class="wrap">

      <div class="eyebrow">Media</div>

      <h1>Pictures I Post</h1>

      <p>
        A collection of moments captured and shared through my lens.
      </p>

    </div>
  </section>


  <!-- PIXELFED PHOTO GALLERY -->
  <section class="media-section">
    <div class="wrap">

      <div
        id="pixelfed-feed"
        class="pf-grid"
        aria-label="Pixelfed photo gallery"
      ></div>

      <p
        id="pixelfed-status"
        class="pf-status"
        role="status"
        aria-live="polite"
      >
        Loading photos…
      </p>

      <div class="pf-more-wrap">
        <button
          id="pixelfed-more"
          class="btn btn-teal"
          type="button"
          hidden
        >
          Load more
        </button>
      </div>

      <noscript>
        <p class="pf-status">
          JavaScript is required to display my Pixelfed photos.
        </p>
      </noscript>

    </div>
  </section>

</main>


<!-- FOOTER -->
<footer class="site-footer">
  <div class="wrap">
    Copyright 2026 by Felix Feger
  </div>
</footer>


<!-- SITE SCRIPTS -->
<script src="js/main.js"></script>
<script src="js/site.js"></script>
<script src="js/pixelfed.js"></script>

</body>
</html>
