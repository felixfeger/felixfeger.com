<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Media — Felix Feger</title>

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="css/style.css">
</head>

<body data-page="media">
<script src="js/site.js"></script>

<main>

  <!-- PAGE INTRODUCTION -->
  <section class="page-hero">
    <div class="wrap">

      <div class="eyebrow">Media</div>

      <h1>Pictures I Post</h1>

      <p>
        A collection of moments captured and shared through my lens.
      </p>

    </div>
  </section>

  <!-- PIXELFED PHOTO GALLERY -->
  <section class="media-section">
    <div class="wrap">

      <div
        id="pixelfed-feed"
        class="pf-grid"
        aria-label="Pixelfed photo gallery"
      ></div>

      <p
        id="pixelfed-status"
        class="pf-status"
        role="status"
        aria-live="polite"
      >
        Loading photos…
      </p>

      <div class="pf-more-wrap">
        <button
          id="pixelfed-more"
          class="btn btn-teal"
          type="button"
          hidden
        >
          Load more
        </button>
      </div>

      <noscript>
        <p class="pf-status">
          JavaScript is required to display my Pixelfed photos.
        </p>
      </noscript>

    </div>
  </section>

</main>

<script src="js/pixelfed.js"></script>

</body>
</html>
